      <path stroke="var(--headset,#ac8de9)" stroke-width="2.5" d="M8 28v-5a23 21 0 0 1 46 0v5m0 12v4q0 5-8 5h-5"/>
      <path stroke="var(--headset,#ac8de9)" stroke-width="7" d="M8 29v10m46-10v10"/>
    </g>
  </defs>

