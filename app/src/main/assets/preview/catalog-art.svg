<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180">
  <title>Five illustrated Twitch stream previews</title>
  <view id="still" viewBox="1600 0 1600 180"/>
  <style>
    .move{animation-duration:5.6s;animation-iteration-count:infinite;animation-play-state:var(--demo-play,running);transform-box:fill-box;transform-origin:center}
    .dota-strike{animation-name:dota-strike}.dota-player{animation-name:dota-player}.dota-hero{animation-name:dota-hero}
    .cs-shot{animation-name:cs-shot}.cs-player{animation-name:cs-player}.cs-recoil{animation-name:cs-recoil}
    .slot-reels{animation-name:slot-reels}.slot-spin{animation-name:slot-spin}.slot-cheer{animation-name:slot-cheer}.slot-stars{animation-name:slot-stars}
    .walker{animation-name:walker;animation-timing-function:linear}.walk-legs{animation-name:walk-legs;animation-duration:.7s;transform-origin:50% 15%}
    .trash-player{animation-name:trash-player}.trash-screen{animation-name:trash-screen}.trash-alerts{animation-name:trash-alerts}
    @keyframes dota-strike{0%,24%,81%,100%{opacity:.35;transform:scale(.72)}37%{opacity:1;transform:scale(1.42)}52%{opacity:.82;transform:scale(1.1)}}
    @keyframes dota-player{0%,25%,80%,100%{transform:none}40%{transform:translate(2px,-5px) rotate(-7deg)}54%{transform:translateY(1px) rotate(4deg)}}
    @keyframes dota-hero{0%,18%,84%,100%{transform:none}33%{transform:translate(16px,-8px)}42%{transform:translate(9px,-5px) rotate(-7deg)}60%{transform:translate(16px,-8px)}}
    @keyframes cs-shot{0%,32%,46%,61%,100%{opacity:0;transform:none}36%,51%{opacity:1;transform:scale(1.2)}41%,55%{opacity:.5;transform:scale(.8)}}
    @keyframes cs-recoil{0%,32%,46%,61%,100%{transform:none}36%,51%{transform:translate(6px,2px) rotate(2deg)}41%,55%{transform:translate(2px,1px)}}
    @keyframes cs-player{0%,32%,68%,100%{transform:none}37%,52%{transform:translate(4px,-4px) rotate(4deg)}43%,58%{transform:translate(-2px,1px)}}
    @keyframes slot-reels{0%,17%,52%,100%{transform:none;opacity:1}20%,45%{opacity:0;transform:translateY(8px)}57%{transform:translateY(-3px)}62%{transform:none}}
    @keyframes slot-spin{0%,17%,51%,100%{opacity:0}23%,36%,46%{opacity:1;transform:translateY(-8px)}29%,42%{opacity:.76;transform:translateY(7px)}}
    @keyframes slot-cheer{0%,50%,93%,100%{transform:none}57%,71%{transform:translateY(-7px) rotate(-4deg)}64%,78%{transform:translateY(-1px) rotate(4deg)}}
    @keyframes slot-stars{0%,49%,100%{opacity:.2;transform:scale(.8)}58%,74%{opacity:1;transform:scale(1.12)}67%,85%{opacity:.6;transform:scale(.95)}}
    @keyframes walker{0%,100%{transform:translateX(-12px)}50%{transform:translateX(14px)}}
    @keyframes walk-legs{0%,100%{transform:scaleX(.98) rotate(-3deg)}50%{transform:scaleX(.72) rotate(5deg)}}
    @keyframes trash-player{0%,36%,83%,100%{transform:none}45%{transform:translate(-4px,-7px) rotate(-6deg)}57%{transform:translate(3px,0) rotate(4deg)}}
    @keyframes trash-screen{0%,33%,100%{opacity:.6}42%,58%{opacity:1}50%,69%{opacity:.72}}
    @keyframes trash-alerts{0%,30%,90%,100%{opacity:0;transform:translateY(7px)}42%,67%{opacity:1;transform:translateY(-5px)}80%{opacity:.45;transform:translateY(-12px)}}
    @media(prefers-reduced-motion:reduce){.move{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="dota" x2="0" y2="1"><stop stop-color="#142c37"/><stop offset="1" stop-color="#296f63"/></linearGradient>
    <linearGradient id="cs" x2="0" y2="1"><stop stop-color="#ecaa69"/><stop offset="1" stop-color="#694044"/></linearGradient>
    <linearGradient id="slots" x2="0" y2="1"><stop stop-color="#3c1749"/><stop offset="1" stop-color="#751f57"/></linearGradient>
    <linearGradient id="walk" x2="0" y2="1"><stop stop-color="#3a5286"/><stop offset="1" stop-color="#de8290"/></linearGradient>
    <linearGradient id="room" x2="0" y2="1"><stop stop-color="#123446"/><stop offset="1" stop-color="#382849"/></linearGradient>
